<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>属性面板金色清理验证</title>
<link rel="stylesheet" href="../../apps/desktop/src/styles.css">
<style>
  body { background: #101417; padding: 34px; display: flex; gap: 30px; align-items: flex-start; color: #e9eef0; }
  .vb { display: grid; gap: 8px; justify-items: center; }
  .vb > small { color: #667074; font-size: 11px; font-family: Consolas, monospace; }
  .preview-frame { position: relative; width: 420px; height: 240px; background: #181c1f; border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>

<div class="vb">
  <aside class="properties-pane pp-panel" style="width: 280px; height: 460px; display: block;">
    <div class="properties-project">
      <section class="property-block" aria-label="项目概览"><h2>项目概览</h2>
        <div class="property-line"><span>项目名称</span><strong>品牌宣传片</strong></div>
        <div class="property-line"><span>状态</span><strong>活动</strong></div>
        <div class="property-line"><span>画布</span><strong>1920×1080 · 30fps</strong></div>
      </section>
      <section class="property-block" aria-label="保存/预览检查"><h2>保存/预览检查</h2>
        <div class="properties-status">保存状态：已保存</div>
        <div class="properties-status">权威预览：已就绪</div>
      </section>
      <section class="property-block" aria-label="下一步动作"><h2>下一步动作</h2>
        <div class="properties-actions">
          <button>生成权威预览</button>
          <button>导出正式视频</button>
          <button>打开项目管理</button>
        </div>
      </section>
    </div>
  </aside>
  <small>属性面板 · 项目概览/下一步动作（金色 → 中性灰 + 薄荷青主按钮）</small>
</div>

<div class="vb">
  <div class="preview-frame">
    <span class="interactive-label stale">权威预览 · 已过期</span>
    <span role="status" class="preview-context stale" style="position:absolute; top:18px; right:18px;">权威预览已过期</span>
    <span role="note" class="synthetic-note" style="position:absolute;">合成预览不可用：段 clip_08a2: 转场 dissolve 超出实时合成子集，已回退交互预览。<button class="synthetic-note-retry">重试合成预览</button></span>
  </div>
  <small>预览区状态标 · 过期/回退提示（旧金 → 琥珀 #e8b45a）</small>
</div>

</body>
</html>
