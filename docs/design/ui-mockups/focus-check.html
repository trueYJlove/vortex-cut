<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>焦点态验证</title>
<link rel="stylesheet" href="../../apps/desktop/src/styles.css">
<style>
  body { background: #101315; padding: 40px; display: grid; gap: 30px; justify-items: start; color: #e9eef0; }
  .case { display: grid; gap: 8px; }
  .case small { color: #667074; font-size: 11px; font-family: Consolas, monospace; }
  .modal-backdrop { position: relative; inset: auto; z-index: auto; padding: 0; }
</style>
</head>
<body>

<div class="case">
  <small>主窗口 .tb-field select（比例/编码同款）— focus 应只有青色边框单层</small>
  <label class="tb-field">比例<select aria-label="预览比例"><option>16:9</option><option>9:16</option><option>1:1</option></select></label>
</div>

<div class="case">
  <small>主窗口 .tb-field select — 未聚焦对照</small>
  <label class="tb-field">编码<select aria-label="编码模式"><option>auto</option><option>h264</option></select></label>
</div>

<div class="case">
  <small>弹窗内 select（项目管理·画布同款）— focus 应只有青边 + 2px 弱环单层</small>
  <div class="modal-backdrop"><section class="modal project-management-modal" role="dialog" style="max-height:none">
    <div class="modal-heading"><div><h2>项目管理</h2></div><button class="icon-btn">✕</button></div>
    <section class="project-management-section"><h3>新建项目</h3><div class="project-form-row">
      <input placeholder="例如：品牌宣传片" />
      <label class="tb-field">画布<select autofocus><option>16:9</option></select></label>
      <button class="compact-command">创建项目</button>
    </div></section>
  </section></div>
</div>

</body>
</html>
