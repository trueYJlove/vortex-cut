<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>P1 画中画 — Vortex Cut 原型</title>
<style>
  :root{
    --bg:#141a1f; --panel:#171d21; --panel2:#1d252b; --border:#293238;
    --text:#e6eaec; --text2:#aeb9bd; --accent:#8aa2ff; --accent2:#5b78f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden}
  .topbar{height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
  .brand{font-weight:700}
  .chip{background:var(--accent);color:#10131c;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700}
  .back{color:var(--text2);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}
  .spacer{flex:1}
  .hint{font-size:11px;color:var(--text2)}
  .hint b{color:var(--accent)}
  .stage{display:flex;height:calc(100vh - 46px)}
  /* canvas */
  .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#10131a 0% 25%,#0c0e13 0% 50%)50%/24px 24px;padding:20px;min-width:0}
  #canvas{position:relative;width:min(70vh,520px);aspect-ratio:9/16;background:#000;border:1px solid var(--border);border-radius:4px;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.55);user-select:none}
  .main{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#223a57,#314a6d 55%,#3a5a4e);color:rgba(255,255,255,.9);font-size:22px;font-weight:700}
  /* 画中画 */
  .pip{position:absolute;border-radius:6px;cursor:move;background:#000;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  .pip .tag{position:absolute;left:0;top:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 7px;border-radius:0 0 6px 0;pointer-events:none;z-index:6}
  .pip .ph{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;pointer-events:none}
  .pip .ph.p1{background:linear-gradient(135deg,#3a6e5b,#5b9a6e)}
  .pip .ph.p2{background:linear-gradient(135deg,#815ea0,#b06a8f)}
  .pip.selected{border:2px solid var(--accent)}
  .pip .h{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--accent);border-radius:50%;z-index:8;display:none}
  .pip.selected .h{display:block}
  .h-nw{left:-7px;top:-7px;cursor:nwse-resize}.h-n{left:50%;top:-7px;margin-left:-6px;cursor:ns-resize}.h-ne{right:-7px;top:-7px;cursor:nesw-resize}
  .h-w{left:-7px;top:50%;margin-top:-6px;cursor:ew-resize}.h-e{right:-7px;top:50%;margin-top:-6px;cursor:ew-resize}
  .h-sw{left:-7px;bottom:-7px;cursor:nesw-resize}.h-s{left:50%;bottom:-7px;margin-left:-6px;cursor:ns-resize}.h-se{right:-7px;bottom:-7px;cursor:nwse-resize}
  /* 文本层 */
  .pip.txt{border:none;box-shadow:none;background:transparent}
  .pip.txt .t{color:#ffe97a;font-size:30px;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none;white-space:nowrap}
  /* props */
  .props{width:300px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:16px}
  .props h4{font-size:14px;margin-bottom:12px}
  .pad{padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);margin-bottom:14px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  .row label{font-size:12px;color:var(--text2);width:66px;flex:none}
  .row input[type=number]{flex:1;min-width:0;background:#0f1418;border:1px solid #2b343b;color:var(--text);padding:5px 8px;border-radius:6px;font-size:13px}
  .unit{color:var(--text2);font-size:11px;width:18px}
  .slider{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;background:#39444c;outline:none}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:8px}
  .check:last-child{margin-bottom:0}
  .check input{width:16px;height:16px;accent-color:var(--accent)}
  .divider{height:1px;background:var(--border);margin:14px 0}
  .btn.add{width:100%;padding:9px;border:none;border-radius:6px;background:var(--accent2);color:#fff;font-weight:600;cursor:pointer}
  .btn.add:hover{filter:brightness(1.08)}
  .trow{display:flex;align-items:center;gap:7px;padding:5px 6px;border:1px solid transparent;border-radius:6px;cursor:pointer}
  .trow:hover{background:rgba(255,255,255,.03)}
  .trow.active{background:rgba(138,162,255,.12);border-color:rgba(138,162,255,.3)}
  .tl{width:36px;font-size:11px;color:#fff;font-weight:700;text-align:center;background:#26303a;border-radius:4px;padding:2px;flex:none}
  .tname{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyl{color:var(--text2);cursor:pointer}
  .eyl.off{opacity:.32}
  .note{font-size:11px;color:var(--text2);line-height:1.7;margin-top:12px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← 全部原型</a>
  <div class="brand">Vortex Cut</div>
  <span class="chip">P1 画中画</span>
  <div class="spacer"></div>
  <span class="hint">可交互原型 · 拖动体验</span>
</div>
<div class="stage">
  <div class="canvas-wrap">
    <div id="canvas">
      <div class="main">主画面</div>

      <div class="pip" id="p1" style="left:6%;top:6%;width:40%">
        <span class="tag">V2 回放</span>
        <div class="ph p1">PIP 视频</div>
      </div>

      <div class="pip txt" id="p2" style="left:22%;bottom:4%;width:60%;padding:6px">
        <div class="t">🔥 Highlight</div>
      </div>
    </div>
  </div>

  <div class="props">
    <h4 id="propTitle">画中画 · 位置与缩放</h4>

    <div class="pad">
      <div class="row"><label>位置 X</label><input type="number" id="px" step="1" /><span class="unit">%</span></div>
      <div class="row"><label>位置 Y</label><input type="number" id="py" step="1" /><span class="unit">%</span></div>
      <div class="row"><label>缩放</label><input type="number" id="ps" step="1" /><span class="unit">%</span></div>
      <div class="row"><label>旋转</label><input type="number" id="pr" step="1" /><span class="unit">°</span></div>
    </div>

    <div class="pad">
      <div class="row"><label>不透明度</label>
        <input type="range" id="po" class="slider" min="0" max="100" value="100" />
      </div>
      <div class="check"><input type="checkbox" id="pf" /><span>水平翻转</span></div>
      <div class="check"><input type="checkbox" id="pl" /><span>锁定</span></div>
    </div>

    <div class="divider"></div>

    <div class="pad">
      <div style="font-size:12px;color:var(--text2);margin-bottom:8px">轨道层级（Z 序）</div>
      <div class="trow active" data-tid="V2"><span class="tl">V2</span><span class="tname">回放覆盖层</span><span class="eyl">👁</span></div>
      <div class="trow" data-tid="V1"><span class="tl">V1</span><span class="tname">主画面</span><span class="eyl">👁</span></div>
      <div class="trow" data-tid="A1"><span class="tl">A1</span><span class="tname">音频</span></div>
    </div>

    <button class="btn add" id="addPip">＋ 添加画中画</button>

    <div class="note">
      <b>交互说明：</b>点选 pip 视频 → 画布上<b>直接拖动</b>移动，拖<b>白色圆点</b>缩放；右侧数值面板双向同步。<br/>
      <b>计划落地点：</b>当前版本仅属性面板精调；本次将新增预览画布拖拽 + 缩放手柄（写 position/scale 关键帧）。
    </div>
  </div>
</div>

<script>
(function(){
  var canvas=document.getElementById('canvas');
  var p1=document.getElementById('p1');
  var p2=document.getElementById('p2');
  var selected='p1';
  var els={p1:p1,p2:p2};

  // 注入手柄
  ['nw','n','ne','e','se','s','sw','w'].forEach(function(d){
    var h=document.createElement('div');h.className='h h-'+d;h.dataset.dir=d;p1.appendChild(h);
  });

  function select(id){
    selected=id;
    p1.classList.toggle('selected',id==='p1');
    p2.classList.toggle('selected',id==='p2');
    syncInputs();
  }

  function getRotate(style){
    var m=style&&style.transform?style.transform.match(/-?[\d.]+(?=deg)/):null;
    return m?m[0]:'0';
  }

  function syncInputs(){
    var el=els[selected];
    var cw=canvas.offsetWidth, ch=canvas.offsetHeight;
    if(el===p1){
      var l=parseFloat(el.style.left), t=parseFloat(el.style.top), w=parseFloat(el.style.width);
      document.getElementById('px').value=Math.round(l*10)/10;
      document.getElementById('py').value=Math.round(t*10)/10;
      document.getElementById('ps').value=Math.round((w/cw)*1000)/10;
      document.getElementById('pr').value=getRotate(el.style);
      document.getElementById('po').value=el.style.opacity?Math.round(parseFloat(el.style.opacity)*100):100;
      document.getElementById('pf').checked=!!el.dataset.flip;
      document.getElementById('pl').checked=!!el.dataset.lock;
    } else {
      var w2=parseFloat(el.style.width);
      document.getElementById('ps').value=Math.round((w2/canvas.offsetWidth)*1000)/10;
    }
  }

  // 数字输入双向
  var pxI=document.getElementById('px'),pyI=document.getElementById('py'),psI=document.getElementById('ps'),prI=document.getElementById('pr'),poI=document.getElementById('po');
  pxI.addEventListener('change',function(){els[selected].style.left=pxI.value+'%'});
  pyI.addEventListener('change',function(){els[selected].style.top=pyI.value+'%'});
  psI.addEventListener('change',function(){var el=els[selected];el.style.width=psI.value+'%'});
  prI.addEventListener('input',function(){els[selected].style.transform='rotate('+prI.value+'deg)'});
  poI.addEventListener('input',function(){els[selected].style.opacity=poI.value/100});

  // 画布拖动（Pointer Events）
  function onDown(e,el,dir){
    if(el.dataset.lock)return;
    select(el.id);
    e.preventDefault();
    var canRect=canvas.getBoundingClientRect();
    var startL=el.offsetLeft, startT=el.offsetTop;
    var startW=el.offsetWidth/canRect.width*100;
    function move(ev){
      var dx=(ev.clientX-e.clientX)/canRect.width*100;
      var dy=(ev.clientY-e.clientY)/canRect.height*100;
      if(!dir){ // move
        el.style.left=(startL+dx)+'%';
        el.style.top=(startT+dy)+'%';
      } else { // resize
        var ns=Math.max(6,Math.min(120,startW+dx*1.6));
        el.style.width=ns+'%';
      }
      syncInputs();
    }
    function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)}
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  }

  // 手柄(CSS offsetLeft 用) —— pip 均绝对定位，offsetLeft 相对 #canvas，OK
  ['p1','p2'].forEach(function(id){
    var el=document.getElementById(id);
    el.addEventListener('pointerdown',function(e){
      var h=e.target.closest('.h');
      onDown(e,h?'resize':null);
    });
  });

  // 轨道点击高亮
  document.querySelectorAll('.trow').forEach(function(r){
    r.addEventListener('click',function(){
      document.querySelectorAll('.trow').forEach(x=>x.classList.remove('active'));
      r.classList.add('active');
    });
  });

  select('p1');
})();
</script>
</body>
</html>
