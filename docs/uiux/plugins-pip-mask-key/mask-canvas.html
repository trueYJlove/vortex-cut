<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>P2 蒙版 — Vortex Cut 原型</title>
<style>
  :root{
    --bg:#141a1f;--panel:#171d21;--panel2:#1d252b;--border:#293238;
    --text:#e6eaec;--text2:#aeb9bd;--accent:#8aa2ff;--accent2:#5b78f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden}
  .topbar{height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
  .brand{font-weight:700}
  .chip{background:var(--accent);color:#10131c;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700}
  .back{color:var(--text2);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}
  .spacer{flex:1}
  .hint{font-size:11px;color:var(--text2)}
  .hint b{color:var(--accent)}
  .stage{display:flex;height:calc(100vh - 46px)}
  .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#10131a 0% 25%,#0c0e13 0% 50%)50%/24px 24px;padding:20px;min-width:0}
  #canvas{position:relative;width:min(70vh,520px);aspect-ratio:9/16;background:#0a0d11;border:1px solid var(--border);border-radius:4px;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.55);user-select:none}
  .src{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7a4a5e,#a0604b 50%,#7a8a3d)}
  .frame{position:absolute;border:2px dashed var(--accent);pointer-events:none}
  .knob{position:absolute;width:15px;height:15px;background:#fff;border:2px solid var(--accent);border-radius:50%;z-index:7;cursor:grab;transform:translate(-50%,-50%)}
  .knob:hover{background:var(--accent)}
  .props{width:300px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:16px}
  .pad{padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);margin-bottom:14px}
  .what{font-size:12px;color:var(--text2);margin-bottom:10px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:10px}.row:last-child{margin-bottom:0}
  .row label{font-size:12px;color:var(--text2);width:66px;flex:none}
  .slider{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;background:#39444c;outline:none}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
  .sw{display:flex;gap:5px}
  .seg{flex:1;text-align:center;padding:7px 4px;border:1px solid #2b343b;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);background:transparent}
  .seg.active{background:var(--accent);color:#0d1120;border-color:var(--accent);font-weight:600}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:8px}.check:last-child{margin-bottom:0}
  .check input{width:16px;height:16px;accent-color:var(--accent)}
  .preview-thumb{position:relative;height:120px;border-radius:8px;overflow:hidden;background:#05070a}
  .thumb-src{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7a4a5e,#a0604b);color:#fff;font-weight:600}
  .note{font-size:11px;color:var(--text2);line-height:1.7;margin-top:12px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← 全部原型</a>
  <div class="brand">Vortex Cut</div>
  <span class="chip">P2 蒙版</span>
  <div class="spacer"></div>
  <span class="hint">原型 · 拖拽调整蒙版区域</span>
</div>
<div class="stage">
  <div class="canvas-wrap">
    <div id="canvas">
      <div class="src" id="srcBox">素材画面（只显示 clip-path 内的可视区）</div>
      <div class="frame" id="frameEl"></div>
    </div>
  </div>

  <div class="props">
    <div class="pad">
      <div class="what">蒙版形状</div>
      <div class="sw">
        <button class="seg" data-shape="rect">矩形</button>
        <button class="seg active" data-shape="ellipse">椭圆</button>
        <button class="seg" data-shape="linear">线性</button>
      </div>
    </div>
    <div class="pad">
      <div class="row"><label>羽化</label>
        <input type="range" id="feather" class="slider" min="0" max="100" value="20" />
        <span style="width:30px;font-size:11px;color:var(--text2);text-align:right" id="featherVal">20</span>
      </div>
      <div class="check"><input type="checkbox" id="invert" /><span>反转蒙版</span></div>
    </div>
    <div class="pad">
      <div class="what">小预览</div>
      <div class="preview-thumb"><div class="thumb-src" id="thumbSrc">可视区</div></div>
    </div>
    <div class="note">
      <b>交互说明：</b>切换形状 → 拖拽画布中心区平移、拖拽 <b>蓝色对角把手</b>缩放；羽化制造软边；反转可选中/排除。<br/>
      <b>计划落地点：</b>TimelineClip.mask（linear/rect/ellipse + feather + invert）→ FFmpeg 几何裁剪渲染 → 画布顶点拖拽。
    </div>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById('canvas');
  var srcBox = document.getElementById('srcBox');
  var frame = document.getElementById('frameEl');
  var thumbSrc = document.getElementById('thumbSrc');
  var shape = 'ellipse';
  var invert = false;
  // 蒙版矩形参数（归一化坐标 0..1）
  var M = { cx: 0.5, cy: 0.52, rx: 0.3, ry: 0.26 };

  function render() {
    var cw = canvas.offsetWidth || 520;
    var ch = canvas.offsetHeight || 925;
    var view;
    if (shape === 'rect') {
      var x0 = (M.cx - M.rx) * 100, y0 = (M.cy - M.ry) * 100;
      var x1 = (M.cx + M.rx) * 100, y1 = (M.cy + M.ry) * 100;
      view = 'polygon(' + x0 + '% ' + y0 + '%,' + x1 + '% ' + y0 + '%,' + x1 + '% ' + y1 + '%,' + x0 + '% ' + y1 + '%)';
    } else if (shape === 'ellipse') {
      view = 'ellipse(' + (M.rx * 100) + '% ' + (M.ry * 100) + '% at ' + (M.cx * 100) + '% ' + (M.cy * 100) + '%)';
    } else {
      // linear：一条斜线，线的"上方"被裁掉，下方保留
      var a = M.cx * 100, b = M.cy * 100;
      var edge = Math.min(b + 18, 100);
      // 分界线经过 (a, b)，两个角
      view = 'polygon(0% 0%,100% 0%,100% ' + edge + '%,' + a + '% ' + b + '%,0% ' + b + '%)';
    }
    srcBox.style.clipPath = view;
    thumbSrc.style.clipPath = view;

    // 虚线框
    if (shape === 'rect' || shape === 'ellipse') {
      frame.style.display = 'block';
      frame.style.left = ((M.cx - M.rx) * 100) + '%';
      frame.style.top = ((M.cy - M.ry) * 100) + '%';
      frame.style.width = (2 * M.rx * 100) + '%';
      frame.style.height = (2 * M.ry * 100) + '%';
    } else {
      frame.style.display = 'block';
      frame.style.left = '0%';
      frame.style.top = (M.cy * 100) + '%';
      frame.style.width = '100%';
      frame.style.height = '0.5px';
    }
  }

  // 上角对角把手（右上）跟随缩放
  var knob = document.getElementById('knobSE');
  function placeKnob() {
    kSE.style.left = ((M.cx + M.rx) * 100) + '%';
    kSE.style.top = ((M.cy + M.ry) * 100) + '%';
  }
  var kSE = document.createElement('div');
  kSE.id = 'knobSE';
  kSE.className = 'knob';
  canvas.appendChild(kSE);

  // 拖动对角把手：缩放 rx/ry（相对中心）
  kSE.addEventListener('pointerdown', function (e) {
    e.stopPropagation(); e.preventDefault();
    function move(ev) {
      var c = canvas.getBoundingClientRect();
      var x = (ev.clientX - c.left) / c.width;
      var y = (ev.clientY - c.top) / c.height;
      x = Math.max(0, Math.min(1, x)); y = Math.max(0, Math.min(1, y));
      // 对角点相对中心 => 半宽/半高
      M.rx = Math.min(0.5, Math.max(0.05, Math.abs(x - M.cx)));
      M.ry = Math.min(0.5, Math.max(0.05, Math.abs(y - M.cy)));
      refresh();
    }
    function up() { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });

  // 拖拽中心(画布空白)平移整个蒙版
  canvas.addEventListener('pointerdown', function (e) {
    if (e.target === kSE) return;
    var c = canvas.getBoundingClientRect();
    var sx = (e.clientX - c.left) / c.width, sy = (e.clientY - c.top) / c.height;
    var dx = M.cx - sx, dy = M.cy - sy;
    function move(ev) {
      var x = (ev.clientX - c.left) / c.width, y = (ev.clientY - c.top) / c.height;
      x = Math.max(0, Math.min(1, x)); y = Math.max(0, Math.min(1, y));
      M.cx = Math.max(M.rx, Math.min(1 - M.rx, x + dx));
      M.cy = Math.max(M.ry, Math.min(1 - M.ry, y + dy));
      refresh();
    }
    function up() { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });

  // 形状切换
  document.querySelectorAll('[data-shape]').forEach(function (seg) {
    seg.addEventListener('click', function () {
      document.querySelectorAll('[data-shape]').forEach(function (s) { s.classList.remove('active'); });
      seg.classList.add('active');
      shape = seg.dataset.shape;
      refresh();
    });
  });

  document.getElementById('feather').addEventListener('input', function () {
    document.getElementById('featherVal').textContent = this.value;
  });
  document.getElementById('invert').addEventListener('change', function () {
    invert = this.checked;
    refresh();
  });

  function refresh() {
    render();
    placeKnob();
  }

  refresh();
})();
</script>
</body>
</html>
