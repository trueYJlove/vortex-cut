<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>P3 抠像 — Vortex Cut 原型</title>
<style>
  :root{
    --bg:#141a1f;--panel:#171d21;--panel2:#1d252b;--border:#293238;
    --text:#e6eaec;--text2:#aeb9bd;--accent:#8aa2ff;--accent2:#5b78f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif;height:100vh;overflow:hidden}
  .topbar{height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
  .brand{font-weight:700}
  .chip{background:var(--accent);color:#10131c;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700}
  .back{color:var(--text2);text-decoration:none;font-size:13px}.back:hover{color:var(--text)}
  .spacer{flex:1}
  .hint{font-size:11px;color:var(--text2)}
  .stage{display:flex;height:calc(100vh - 46px)}
  .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#10131a 0% 25%,#0c0e13 0% 50%)50%/24px 24px;padding:20px;min-width:0}
  #canvas{position:relative;width:min(70vh,520px);aspect-ratio:9/16;border-radius:4px;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.55);user-select:none}
  /* 棋盘背景 = 透明 */
  .body{position:absolute;inset:0;
    background-image:conic-gradient(#1a1f25 0 90deg,#0d1116 90deg 180deg,#1a1f25 180deg 270deg,#0d1116 270deg 360deg);
    background-size:18px 18px;}
  /* 主体对象：前景保留 */
  .subject{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:52%;aspect-ratio:3/4;
    background:linear-gradient(160deg,#e8c9a0,#c99a6a 45%,#8f6a4b);
    clip-path:polygon(40% 0,60% 0,78% 22%,70% 62%,60% 100%,40% 100%,28% 60%,18% 22%);
    filter:var(--ff,sepia(0));}
  .subject .face{position:absolute;left:50%;top:12%;width:44%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:linear-gradient(150deg,#f0cfaE,#e0a97f);box-shadow:inset -8px -6px 14px rgba(0,0,0,.18)}
  /* 绿幕背景（会随"抠像"被替换透明度） */
  .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 20%, #2e7d4f, #1d4f33 70%);transition:opacity .15s}
  .props{width:300px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:16px}
  .pad{padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);margin-bottom:14px}
  .what{font-size:12px;color:var(--text2);margin-bottom:10px}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:10px}.row:last-child{margin-bottom:0}
  .row label{font-size:12px;color:var(--text2);width:66px;flex:none}
  .slider{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;background:#39444c;outline:none}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer}
  .sw{display:flex;gap:5px}
  .seg{flex:1;text-align:center;padding:7px 4px;border:1px solid #2b343b;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);background:transparent}
  .seg.active{background:var(--accent);color:#0d1120;border-color:var(--accent);font-weight:600}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .check input{width:16px;height:16px;accent-color:var(--accent)}
  .colorline{display:flex;align-items:center;gap:8px}
  .swatch{width:34px;height:24px;border-radius:5px;border:1px solid #000;flex:none}
  .note{font-size:11px;color:var(--text2);line-height:1.7;margin-top:12px}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← 全部原型</a>
  <div class="brand">Vortex Cut</div>
  <span class="chip">P3 抠像（Chroma Key）</span>
  <div class="spacer"></div>
  <span class="hint">原型 · 取色 + 阈值/羽化</span>
</div>
<div class="stage">
  <div class="canvas-wrap">
    <div id="canvas">
      <div class="bg" id="bgEl">绿幕背景</div>
      <div class="subject" id="subEl">
        <div class="face"></div>
      </div>
      <div style="position:absolute;left:0;bottom:0;font-size:10px;color:#000;background:rgba(255,255,255,.6);padding:2px 6px;z-index:3">点击此处取色</div>
    </div>
  </div>

  <div class="props">
    <div class="pad">
      <div class="what">抠像开关</div>
      <div class="sw">
        <button class="seg" data-mode="off">原画面</button>
        <button class="seg active" data-mode="on">抠像</button>
      </div>
    </div>

    <div class="pad">
      <div class="what">背景取色（点画布或下方色块）</div>
      <div class="colorline"><div class="swatch" id="pickSw" style="background:#1d4b3f"></div><span style="font-size:12px;color:var(--text2)" id="pickHex">#1d4b3f</span></div>
    </div>

    <div class="pad">
      <div class="row"><label>阈值</label>
        <input type="range" id="thresh" class="slider" min="0" max="100" value="45" />
        <span style="width:30px;font-size:11px;color:var(--text2);text-align:right" id="threshVal">45</span>
      </div>
      <div class="row"><label>羽化</label>
        <input type="range" id="feather" class="slider" min="0" max="100" value="18" />
        <span style="width:30px;font-size:11px;color:var(--text2);text-align:right" id="featherVal">18</span>
      </div>
    </div>

    <div class="pad">
      <div class="check"><input type="checkbox" id="spill" checked /><span>去溢边（green spill 抑制）</span></div>
    </div>

    <div class="note">
      <b>交互说明：</b>切到「抠像」→ 绿幕变透明棋盘 → 点画布绿幕处取背景色 / 或在属性里选；调<b>阈值</b>控制抠除范围、<b>羽化</b>控制边缘软硬。<br/>
      <b>计划落地点：</b>TimelineClip.keying（color + similarity + blend）→ FFmpeg <code>chromakey</code>/<code>colorkey</code>（本地）渲染 → 画布取色器交互。AI 智能抠像留后续。
    </div>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById('canvas');
  var bgEl = document.getElementById('bgEl');
  var subEl = document.getElementById('subEl');
  var mode = 'on';
  // 当前取的背景色（RGB 0..255），初始为绿幕主色
  var pick = { r: 29, g: 77, b: 63 };

  function toHex(arr) {
    return arr.map(function (v) {
      var h = Math.max(0, Math.min(255, Math.round(v))).toString(16);
      return h.length === 1 ? '0' + h : h;
    }).join('');
  }

  function setPick(r, g, b) {
    pick = { r: r, g: g, b: b };
    document.getElementById('pickSw').style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
    document.getElementById('pickHex').textContent = '#' + toHex([r, g, b]);
  }

  function apply() {
    var thresh = parseInt(document.getElementById('thresh').value, 10) / 100;
    var feather = parseInt(document.getElementById('feather').value, 10) / 100;
    document.getElementById('threshVal').textContent = Math.round(thresh * 100);
    document.getElementById('featherVal').textContent = Math.round(feather * 100);

    if (mode === 'off') {
      // 原画面：绿幕可见
      bgEl.style.opacity = '1';
      var r = pick.r, g = pick.g, b = pick.b;
      bgEl.style.background =
        'radial-gradient(circle at 50% 20%, rgb(' + r + ',' + g + ',' + b + '), rgb(' +
        Math.round(r * 0.5) + ',' + Math.round(g * 0.5) + ',' + Math.round(b * 0.5) + ') 70%)';
      subEl.style.filter = 'none';
      return;
    }
    // 抠像：绿幕透明（露棋盘格），主体保留；阈值越高剔除越强 / 羽化软化边缘
    bgEl.style.opacity = '0';
    var keep = Math.min(1, Math.max(0, 0.2 + (1 - thresh)));
    var sat = 0.85 + thresh * 0.6;
    var op = keep * 0.9 + 0.35;
    subEl.style.filter = 'saturate(' + sat + ') opacity(' + op + ')';
  }

  // 取背景色：原型演示里点画布任意位置 = 取成"绿幕主色"（示意一键取背景色交互）
  canvas.addEventListener('click', function (e) {
    var c = canvas.getBoundingClientRect();
    var relY = (e.clientY - c.top) / c.height; // 0 顶 -> 1 底
    var relX = (e.clientX - c.left) / c.width;
    var g = Math.round(60 + 130 * (1 - relY));
    var r = Math.round(20 + 45 * relX);
    var b = Math.round(25 + 35 * relY);
    setPick(r, g, b);
    apply();
  });

  document.querySelectorAll('[data-mode]').forEach(function (seg) {
    seg.addEventListener('click', function () {
      document.querySelectorAll('[data-mode]').forEach(function (s) { s.classList.remove('active'); });
      seg.classList.add('active');
      mode = seg.dataset.mode;
      apply();
    });
  });

  document.getElementById('thresh').addEventListener('input', apply);
  document.getElementById('feather').addEventListener('input', apply);
  document.getElementById('spill').addEventListener('change', apply);

  setPick(pick.r, pick.g, pick.b);
  apply();
})();
</script>
</body>
</html>
