[project]
name = "aivideo-core"
version = "0.0.1"
description = "AI Video Studio Stage 0 local Core sidecar"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "faster-whisper>=1.0,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<1",
  "pyright>=1.1.390,<2",
  "pyinstaller>=6.11,<7",
]

[tool.pytest.ini_options]
pythonpath = ["services/core/src"]
testpaths = ["services/core/tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
  "real_provider: explicit opt-in test that sends selected text to a configured external provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/core/src", "services/core/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["services/core/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/core/src"]
