[project]
name = "aivideo-core"
version = "0.0.1"
description = "Vortex Cut 本地优先视频剪辑工具的 Core sidecar"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "faster-whisper>=1.0,<2",
  "numpy>=2.0,<3",
  "onnxruntime>=1.18,<2",
  "httpx>=0.27,<1",
  "av>=18,<19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<1",
  "pyright>=1.1.390,<2",
  "pyinstaller>=6.11,<7",
]

[tool.pytest.ini_options]
pythonpath = ["services/core/src"]
testpaths = ["services/core/tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
# 临时目录：默认保留最近 3 次全量运行，而本仓库集成测试会生成真实媒体夹具（单次全量 10+GB），
# 多轮累积会写满系统盘（2026-10-10 实测 %TEMP% 下 pytest-of-* 达 41.6GB，全量回归因 ENOSPC 中断）。
# **不要**用 tmp_path_retention_policy="failed" + count=1 来省盘：那会让"已通过"用例的临时目录
# 被过早回收，导致全量随机红（同机对照：原策略 unit 范围 989 passed / 0 failed；收紧后同一范围
# 出现 test_decode_capability_probe / test_bootstrap 等失败，且各自单跑必绿）。
# 需要的只是**偶发手工清理**：rm -rf "$TEMP"/pytest-of-*  （或 CI 每轮 --basetemp 后自行删除）。
markers = [
  "real_provider: explicit opt-in test that sends selected text to a configured external provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/core/src", "services/core/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["services/core/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/core/src"]
