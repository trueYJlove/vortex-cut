appId: io.github.trueyjlove.vortexcut
productName: Vortex Cut
directories:
  output: release
  buildResources: build
electronDist: node_modules/electron/dist
files:
  - out
  - package.json
extraResources:
  - from: ../../resources/core/aivs-core
    to: core/aivs-core
    filter:
      - '**/*'
  - from: ../../resources/ffmpeg/win-x64
    to: ffmpeg/win-x64
    filter:
      - ffmpeg.exe
      - ffprobe.exe
  - from: ../../resources/licenses
    to: licenses
    filter:
      - '**/*'
  - from: ../../resources/manifests
    to: manifests
    filter:
      - components.json
  - from: ../../resources/model-manifests
    to: model-manifests
    filter:
      - '*.json'
  - from: ../../resources/recipes
    to: recipes
    filter:
      - '*.json'
  - from: ../../resources/platform-presets
    to: platform-presets
    filter:
      - '*.json'
  - from: ../../resources/renditions
    to: renditions
    filter:
      - '*.json'
  - from: ../../resources/fonts
    to: fonts
    filter:
      - '**/*'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: VortexCut-Setup-${version}-x64.exe
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
